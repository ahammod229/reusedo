name: Deploy Supabase (database + Edge Functions)

# Manual only. Applies supabase/migrations and deploys supabase/functions to the project you name.
# Repository secrets needed (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (Supabase → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD    the project's database password
# Optional, to set the Edge Function secrets in the same run (anything left empty is skipped):
#   FIREBASE_SERVICE_ACCOUNT_AUTH   JSON key of a service account with "Firebase Authentication Admin"
#   RESEND_API_KEY, EMAIL_CODE_PEPPER, GEMINI_API_KEY, STEADFAST_API_KEY, STEADFAST_SECRET_KEY
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (the part before .supabase.co)"
        required: true
      migrate:
        description: "Apply the database migration (fresh, empty project only)"
        type: boolean
        default: false
      allowed_origins:
        description: "Web origins allowed to call the functions, comma separated"
        required: true
        default: "https://reuse-do.web.app,https://reuse-do.firebaseapp.com"
      email_from:
        description: "Sender of the verification emails, e.g. ReuseDo <no-reply@yourdomain>"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: ${{ inputs.migrate }}
        run: supabase db push

      - name: Set function secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTH }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_CODE_PEPPER: ${{ secrets.EMAIL_CODE_PEPPER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY }}
          STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY }}
          ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
          EMAIL_FROM: ${{ inputs.email_from }}
        run: |
          set -eu
          args=""
          for name in ALLOWED_ORIGINS EMAIL_FROM RESEND_API_KEY EMAIL_CODE_PEPPER GEMINI_API_KEY STEADFAST_API_KEY STEADFAST_SECRET_KEY; do
            value="$(printenv "$name" || true)"
            [ -n "$value" ] && supabase secrets set "$name=$value" >/dev/null && echo "set $name"
          done
          supabase secrets set FIREBASE_PROJECT_ID=reuse-do >/dev/null && echo "set FIREBASE_PROJECT_ID"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            supabase secrets set "FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT" >/dev/null && echo "set FIREBASE_SERVICE_ACCOUNT"
          fi

      - name: Deploy Edge Functions
        run: supabase functions deploy email-code ai-draft admin-courier --no-verify-jwt
