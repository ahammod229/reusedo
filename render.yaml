services:
  - type: web
    name: binimoy-api
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter api run build
    startCommand: pnpm --filter api run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      # Define other necessary environment variables (Supabase, Firebase) in the Render Dashboard
